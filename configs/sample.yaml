# The main method, end to end, on synthetic data: `trs reproduce --sample`. No Spark, no
# GPU and no Netflix data, so it runs on any laptop in under a minute.
#
# Every synthetic user's tastes change in January 2005 (month 12 of 24), so history from
# before then misleads a model. Users pick films at random, and only their stars follow
# their tastes, so ALS here predicts stars. The main experiment's preference ALS learns
# which films were picked, and would find nothing in this data.

synthetic:
  users: 500
  films: 200
  ratings: 40000
  first_year: 2004
  months: 24
  change_month_index: 12
  noise: 0.3
  seed: 0

design:
  first_day: "2004-01-01"
  window_months: [1, 3, 6, 12, null]
  test_cutoffs: ["2005-08-01", "2005-09-01", "2005-10-01"]
  test_months: 1
  seeds: [1]
  als:
    variant: rating
    rank: 5
    regularization: 0.05
    iterations: 15

measurement:
  k: 10
  relevant_stars: 4
  evaluation_seed: 2026

# The known answer: at every cutoff, ALS on the months after the change must beat ALS on
# all history, which is mostly from before it.
known_answer:
  after_change_window: 6

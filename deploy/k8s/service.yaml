apiVersion: apps/v1
kind: Deployment
metadata:
  name: recsys
  labels:
    app: recsys
spec:
  # Fixed copies, no autoscaling: on one machine every copy shares the same CPUs (decision 039).
  replicas: 2
  selector:
    matchLabels:
      app: recsys
  template:
    metadata:
      labels:
        app: recsys
    spec:
      # Put one copy on each worker, so losing a node leaves one serving.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          # Count only nodes that accept these pods, so the control-plane node is left out.
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: recsys
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: recsys
          image: temporal-recsys:dev
          # The image is loaded into kind directly and never pushed to a registry.
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: BUNDLE_PATH
              value: /data/bundle.npz
          volumeMounts:
            - name: bundle
              mountPath: /data
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The bundle loads before the server listens, so allow up to a minute to start.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: bundle
          hostPath:
            path: /artifacts
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: recsys
spec:
  # A fixed node port lets the load tool, which runs beside the cluster, reach the service.
  type: NodePort
  selector:
    app: recsys
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080

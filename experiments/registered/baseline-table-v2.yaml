id: baseline-table-v2
version: 2
registered_on: "2026-10-31"
supersedes: baseline-table
change_reason: >-
  In version 1 the best confidence, 10, was the lowest value tried, and the two regularization
  values gave almost identical scores, so the grid did not test them. Spark ALS will search
  lower confidence values, so NumPy ALS must search them too or the comparison would be unfair.
  This version was written after the version 1 test scores were known. Version 1 stays
  reported, and any improvement here must be read with that in mind.

question: >-
  Does a wider search change NumPy preference ALS's temporal scores, and does a larger penalty
  have any effect?
prediction: >-
  A lower confidence scores somewhat higher than 10 on the tuning cutoff. Regularization still
  has little effect at 10 and 100, and begins to matter at 1000.

data:
  dataset: Netflix Prize, 100,480,507 ratings
  source_revision: monthly data from trs ingest, checked against known totals
  partition_scheme: one folder per rating month

design:
  baseline: popularity
  treatments:
    - preference ALS
  window_months: 12
  tuning_cutoff: "2005-07-01"
  test_cutoffs: ["2005-08-01", "2005-09-01", "2005-10-01"]
  test_months: 1
  seeds: [1, 2]
  n_films: 17770
  fixed_parameters:
    rank: 20
    iterations: 10
  rating_grid:
    regularization: []
  preference_grid:
    regularization: [10.0, 100.0, 1000.0]
    confidence: [1.0, 3.0, 10.0]
  leakage:
    cutoff: "2005-10-01"
    seeds: []

measurement:
  primary_metric: NDCG@10 against the full catalog, excluding films seen in training
  secondary_metrics:
    - Recall@10
    - fit seconds
    - training rows
  relevance: a test rating of 4 or 5 stars
  k: 10
  relevant_stars: 4
  max_users: 50000
  evaluation_seed: 2026
  what_is_timed: model fitting only
  hardware: Kaggle CPU notebook, 4 cores, 31.3 GB memory
  repetitions: 2

analysis:
  uncertainty_method: >-
    Mean and range across cutoffs and seeds, plus the standard error across sampled users
    within each arm.
  exclusions: >-
    Rating ALS and the random split are not rerun. Their version 1 results stand. Other
    exclusions match version 1.
  what_would_change_the_conclusion: >-
    Settings are chosen on the tuning cutoff only. If the best setting is at the edge of the
    grid, report that rather than extending the grid.
  known_limitations: >-
    The authors had seen version 1's test scores when widening this grid. Other limitations
    match version 1.

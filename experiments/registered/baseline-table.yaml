id: baseline-table
version: 1
registered_on: "2026-10-31"
supersedes: null
change_reason: null

question: >-
  How do popularity, rating-prediction ALS and preference-weighted ALS compare on a
  12-month window under temporal evaluation, and how much does a random split inflate
  their scores?
prediction: >-
  Preference ALS beats rating ALS on NDCG@10. Rating ALS may lose to popularity, because
  it predicts stars without learning which films people choose. Popularity is hard to
  beat because it benefits from selection bias. Random splits score higher than temporal
  splits for the personalized models.

data:
  dataset: Netflix Prize, 100,480,507 ratings
  source_revision: monthly data from trs ingest, checked against known totals
  partition_scheme: one folder per rating month

design:
  baseline: popularity
  treatments:
    - rating ALS
    - preference ALS
  window_months: 12
  tuning_cutoff: "2005-07-01"
  test_cutoffs: ["2005-08-01", "2005-09-01", "2005-10-01"]
  test_months: 1
  seeds: [1, 2]
  n_films: 17770
  fixed_parameters:
    rank: 20
    iterations: 10
  rating_grid:
    regularization: [0.02, 0.05, 0.1]
  preference_grid:
    regularization: [1.0, 10.0]
    confidence: [10.0, 40.0]
  leakage:
    cutoff: "2005-10-01"
    seeds: [1]

measurement:
  primary_metric: NDCG@10 against the full catalog, excluding films seen in training
  secondary_metrics:
    - Recall@10
    - fit seconds
    - training rows
  relevance: a test rating of 4 or 5 stars
  k: 10
  relevant_stars: 4
  max_users: 50000
  evaluation_seed: 2026
  what_is_timed: model fitting only
  hardware: Kaggle CPU notebook, 4 cores, 31.3 GB memory
  repetitions: 2

analysis:
  uncertainty_method: >-
    Mean and range across cutoffs and seeds, plus the standard error across sampled users
    within each arm.
  exclusions: >-
    Known-user results exclude users absent from training. New users are reported
    separately for popularity only, because ALS cannot score them. November and December
    2005 are excluded because the held-back share reaches 12.0% and 24.6%.
  what_would_change_the_conclusion: >-
    If the ranges of two models overlap across cutoffs and seeds, report no clear
    difference. Settings are chosen on the tuning cutoff only and never revisited after
    seeing the test cutoffs.
  known_limitations: >-
    Offline scores favor popular films, because people rate what they are shown. Held-back
    ratings remove some recent ratings from each user: 3.5% to 5.5% of ratings in the test
    months. All users in the data passed a selection the organizers applied.

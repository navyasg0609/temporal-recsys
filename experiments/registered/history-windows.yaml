id: history-windows
version: 1
registered_on: "2026-11-02"
supersedes: null
change_reason: null

question: >-
  How much history does each model need, what does each extra month cost in compute, and does
  the neural model need more or less history than ALS?
prediction: >-
  Popularity does best on 1 month. Spark ALS does best on 3 months or less. The two-tower model
  needs more history than ALS, partly because short windows give it fewer training steps. No
  model gains from history beyond 12 months, while cost keeps rising with rows. The two-tower
  model scores highest at its best window.

data:
  dataset: Netflix Prize, 100,480,507 ratings, with film titles and release years
  source_revision: monthly data from trs ingest, checked against known totals
  partition_scheme: one folder per rating month

design:
  baseline: popularity on the same window
  treatments:
    - Spark preference ALS
    - two-tower model with title and year features
  first_day: "1999-11-01"
  window_months: [1, 3, 6, 12, 24, null]
  test_cutoffs: ["2005-08-01", "2005-09-01", "2005-10-01"]
  test_months: 1
  seeds: [1, 2]
  n_films: 17770
  spark_als:
    rank: 20
    regularization: 0.01
    confidence: 3.0
    iterations: 10
  two_tower:
    dimensions: 64
    max_history: 50
    batch_size: 4096
    epochs: 3
    learning_rate: 0.001
    temperature: 0.1

measurement:
  primary_metric: NDCG@10 against the full catalog, excluding every film the user rated before the cutoff
  secondary_metrics:
    - Recall@10
    - training seconds
    - training rows
    - users present in the window
  relevance: a test rating of 4 or 5 stars
  k: 10
  relevant_stars: 4
  max_users: 50000
  evaluation_seed: 2026
  what_is_timed: >-
    Spark read, fit and copy for ALS, and training epochs for the two-tower model. Popularity
    is not timed. Scoring is not timed.
  hardware: >-
    Spark ALS and popularity on a Kaggle CPU notebook, 4 cores, 31.3 GB memory, Spark in local
    mode. The two-tower model on a Kaggle GPU notebook, one Tesla T4, 4 cores, 31.3 GB memory.
  repetitions: 2

analysis:
  uncertainty_method: >-
    Mean and range across cutoffs and seeds, plus the standard error across sampled users
    within each arm.
  exclusions: >-
    All windows at a cutoff share the users who rated anything before it. Users absent from a
    window get that window's popular films. New users, and November and December 2005, are
    excluded as in the baseline table.
  what_would_change_the_conclusion: >-
    History needed is the shortest window scoring at least 95% of the model's best window at
    every cutoff, using the mean across seeds. Two models differ clearly at a window only if one
    is higher at every cutoff. This paired rule is new, because the range rule in earlier plans
    mixes differences between months with differences between models. It does not change any
    earlier conclusion. No settings are retuned per window.
  known_limitations: >-
    Scores differ slightly from earlier plans, because every window now removes all earlier
    films and includes users missing from the window. Settings were tuned on 12 months, which
    can favor that window. Fixed epochs give short windows fewer training steps. The two-tower
    input stops at 50 films per user. Times come from different hardware and cannot be compared
    across models. Three test months cannot show how far this generalizes. Recency may partly
    reflect what the service promoted, which this data cannot separate.

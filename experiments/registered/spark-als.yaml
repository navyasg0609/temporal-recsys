id: spark-als
version: 1
registered_on: "2026-10-31"
supersedes: null
change_reason: null

question: >-
  Does Spark preference ALS beat popularity on the temporal split, and how does it compare
  with NumPy preference ALS on the same cutoffs?
prediction: >-
  Spark ALS beats popularity with no overlap in ranges. Its NDCG@10 is close to NumPy
  preference ALS, but the two can differ because their penalties are defined differently.

data:
  dataset: Netflix Prize, 100,480,507 ratings
  source_revision: monthly data from trs ingest, checked against known totals
  partition_scheme: one folder per rating month

design:
  baseline: popularity, and NumPy preference ALS, from baseline-table-v2
  treatments:
    - Spark preference ALS
  window_months: 12
  tuning_cutoff: "2005-07-01"
  test_cutoffs: ["2005-08-01", "2005-09-01", "2005-10-01"]
  test_months: 1
  seeds: [1, 2]
  n_films: 17770
  fixed_parameters:
    rank: 20
    iterations: 10
  grid:
    regularization: [0.01, 0.05, 0.25]
    confidence: [1.0, 3.0, 10.0]

measurement:
  primary_metric: NDCG@10 against the full catalog, excluding films seen in training
  secondary_metrics:
    - Recall@10
    - read, fit and collect seconds
    - training rows
  relevance: a test rating of 4 or 5 stars
  k: 10
  relevant_stars: 4
  max_users: 50000
  evaluation_seed: 2026
  what_is_timed: reading, fitting and copying factors, each separately
  hardware: Kaggle CPU notebook, 4 cores, 31.3 GB memory, Spark in local mode
  repetitions: 2

analysis:
  uncertainty_method: >-
    Mean and range across cutoffs and seeds, plus the standard error across sampled users
    within each arm.
  exclusions: >-
    Known users only, as in the baseline table. November and December 2005 are excluded for
    the same reason. The pilot's score did not influence this grid beyond including its
    setting, and the pilot is not counted as an arm here.
  what_would_change_the_conclusion: >-
    If the ranges of two models overlap across cutoffs and seeds, report no clear difference.
    Settings are chosen on the tuning cutoff only. If the best setting is at the edge of the
    grid, report that rather than extending the grid.
  known_limitations: >-
    Spark in local mode on one machine is not distributed. The penalty differs from the NumPy
    model, so the two are related models, not one model on two engines. Offline scores favor
    popular films. The confidence values match baseline-table-v2 so neither model gets a
    wider search.

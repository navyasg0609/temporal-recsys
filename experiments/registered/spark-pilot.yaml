id: spark-pilot
version: 1
registered_on: "2026-10-31"
supersedes: null
change_reason: null

question: >-
  How long does one Spark ALS fit take on the 12-month tuning window, so that the later
  plans can be sized to fit the available compute?
prediction: >-
  Spark takes longer than the 422 seconds NumPy preference ALS took on this window with
  the same rank and iterations, because Spark adds overhead on one machine.

data:
  dataset: Netflix Prize, 100,480,507 ratings
  source_revision: monthly data from trs ingest, checked against known totals
  partition_scheme: one folder per rating month

design:
  baseline: none, because this is a timing check and compares no models
  treatments:
    - Spark preference ALS
  window_months: 12
  tuning_cutoff: "2005-07-01"
  test_cutoffs: []
  test_months: 1
  seeds: [1]
  n_films: 17770
  fixed_parameters:
    rank: 20
    iterations: 10
  grid:
    regularization: [0.05]
    confidence: [10.0]

measurement:
  primary_metric: read, fit and collect seconds
  secondary_metrics:
    - NDCG@10 on the tuning cutoff, as a check that the model learned something
  relevance: a test rating of 4 or 5 stars
  k: 10
  relevant_stars: 4
  max_users: 50000
  evaluation_seed: 2026
  what_is_timed: reading, fitting and copying factors, each separately
  hardware: Kaggle CPU notebook, 4 cores, 31.3 GB memory, Spark in local mode
  repetitions: 1

analysis:
  uncertainty_method: None. One run gives a rough size for planning, not a benchmark.
  exclusions: >-
    The test cutoffs are not touched. This score must not be used to choose settings for
    the later plans, except as one arm of the tuning grid if that grid is run in full.
  what_would_change_the_conclusion: >-
    If NDCG@10 is near zero, the Spark model is investigated before any further run.
  known_limitations: >-
    One run, on one machine, with a cold start. Spark in local mode is not distributed.

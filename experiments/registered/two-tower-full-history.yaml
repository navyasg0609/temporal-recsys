id: two-tower-full-history
version: 1
registered_on: "2026-11-01"
supersedes: null
change_reason: null

question: >-
  How long does one two-tower arm take on all ratings before the last test cutoff, so the main
  experiment's largest window can be budgeted?
prediction: >-
  Training takes about twice the pilot's 376 seconds, because the window holds about twice the
  rows, and the arm finishes inside one Kaggle session.

data:
  dataset: Netflix Prize, 100,480,507 ratings, with film titles and release years
  source_revision: monthly data from trs ingest, checked against known totals
  partition_scheme: one folder per rating month

design:
  baseline: none, because this is a timing check and compares no models
  treatments:
    - two-tower model with title and year features
  window_months: 71
  tuning_cutoff: "2005-10-01"
  test_cutoffs: []
  test_months: 1
  seeds: [1]
  n_films: 17770
  compare_id_only: false
  fixed_parameters:
    dimensions: 64
    max_history: 50
    batch_size: 4096
  grid:
    epochs: [3]
    learning_rate: [0.001]
    temperature: [0.05]

measurement:
  primary_metric: training seconds
  secondary_metrics:
    - training rows
    - NDCG@10, as a check that the model learned something
  relevance: a test rating of 4 or 5 stars
  k: 10
  relevant_stars: 4
  max_users: 50000
  evaluation_seed: 2026
  what_is_timed: training epochs, which include building each batch on the CPU
  hardware: Kaggle GPU notebook, one Tesla T4, 4 cores, 31.3 GB memory
  repetitions: 1

analysis:
  uncertainty_method: None. One run gives a rough size for planning, not a benchmark.
  exclusions: >-
    The stage label reads tune because the runner has one grid stage, but nothing is chosen
    from this run. Its score is not reported as a history comparison, which belongs to the
    main experiment and its own registered plan.
  what_would_change_the_conclusion: >-
    If the arm does not finish, the main experiment drops or shortens its largest window for
    this model, and that change is registered first.
  known_limitations: >-
    One run on one GPU, with pilot settings. This window starts at the first rating, in
    November 1999, but the model reads at most each user's latest 50 films.

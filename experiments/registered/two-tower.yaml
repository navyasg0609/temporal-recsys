id: two-tower
version: 1
registered_on: "2026-11-01"
supersedes: null
change_reason: null

question: >-
  Does the two-tower model beat ALS and recent popularity on the temporal split, across the
  same cutoffs and seeds as ALS?
prediction: >-
  The two-tower model beats Spark ALS and 1-month popularity on NDCG@10, with no overlap in
  ranges. 1-month popularity beats the 12-month ALS models. Both follow from the diagnostic on
  the tuning cutoff, so this plan tests whether they hold on later months.

data:
  dataset: Netflix Prize, 100,480,507 ratings, with film titles and release years
  source_revision: monthly data from trs ingest, checked against known totals
  partition_scheme: one folder per rating month

design:
  baseline: >-
    1-month popularity, run here, and 12-month popularity, NumPy ALS and Spark ALS from
    baseline-table-v2 and spark-als
  treatments:
    - two-tower model with title and year features
  window_months: 12
  tuning_cutoff: "2005-07-01"
  test_cutoffs: ["2005-08-01", "2005-09-01", "2005-10-01"]
  test_months: 1
  seeds: [1, 2]
  n_films: 17770
  compare_id_only: false
  recent_popularity_months: 1
  fixed_parameters:
    dimensions: 64
    max_history: 50
    batch_size: 4096
  grid:
    epochs: [3]
    learning_rate: [0.001]
    temperature: [0.02, 0.05, 0.1]

measurement:
  primary_metric: NDCG@10 against the full catalog, excluding films seen in training
  secondary_metrics:
    - Recall@10
    - training seconds
    - training rows
  relevance: a test rating of 4 or 5 stars
  k: 10
  relevant_stars: 4
  max_users: 50000
  evaluation_seed: 2026
  what_is_timed: training epochs, which include building each batch on the CPU
  hardware: Kaggle GPU notebook, one Tesla T4, 4 cores, 31.3 GB memory
  repetitions: 2

analysis:
  uncertainty_method: >-
    Mean and range across cutoffs and seeds, plus the standard error across sampled users
    within each arm.
  exclusions: >-
    Known users only, as in the baseline table. November and December 2005 are excluded for the
    same reason. 1-month popularity is evaluated on the same users and seen films as the
    12-month models.
  what_would_change_the_conclusion: >-
    If the ranges of two models overlap across cutoffs and seeds, report no clear difference.
    Settings are chosen on the tuning cutoff only. If the best setting is at the edge of the
    grid, report that rather than extending the grid.
  known_limitations: >-
    This model gets 3 tuning settings against 9 for ALS, which can only count against it. The
    prediction was written after seeing the tuning cutoff. Training on a GPU is not exactly
    repeatable: the same seed gave 0.1123 and 0.1135 on the tuning cutoff. Title and year
    features are compared on the tuning cutoff only. Offline scores favor popular films, and
    recent films get extra exposure on the service, which may raise recency-based scores.

[project]
name = "temporal-recsys"
version = "0.1.0"
description = "How much history does a recommender need? Quality against compute across training windows."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Navya S G" }]
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = [
    "hypothesis>=6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/temporal_recsys"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["spark: needs a local Spark session"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "S", "SIM", "UP", "W"]
# `functions as F` is the standard PySpark import.
ignore = ["N812"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

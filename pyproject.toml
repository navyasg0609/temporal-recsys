[project]
name = "temporal-recsys"
version = "0.1.0"
description = "How much history does a recommender need? Quality against compute across training windows."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Navya S G" }]
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = [
    "hypothesis>=6",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/temporal_recsys"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["spark: needs a local Spark session"]

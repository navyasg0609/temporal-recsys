[project]
name = "temporal-recsys"
version = "0.1.0"
description = "How much history does a recommender need? Quality against compute across training windows."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Navya S G" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2",
    "pyarrow>=17",
    "pyspark==4.0.4",
    "pyyaml>=6.0.3",
    "scipy>=1.14",
]

[project.optional-dependencies]
# Optional so that installing this package on Kaggle keeps Kaggle's own GPU build.
neural = ["torch==2.11.0"]

[project.scripts]
trs = "temporal_recsys.cli:main"

[dependency-groups]
dev = [
    "temporal-recsys[neural]",
    "hypothesis>=6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8",
    "ruff>=0.5",
    "types-pyyaml>=6.0.12.20261030",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
temporal-recsys = { workspace = true }
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/temporal_recsys"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["spark: needs a local Spark session"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "S", "SIM", "UP", "W"]
# `functions as F` is the standard PySpark import.
ignore = ["N812"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "scipy", "scipy.*"]
ignore_missing_imports = true
